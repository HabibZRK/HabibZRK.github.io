{% assign current_lang = page.lang | default: "en" %}
{% assign english_url = page.translation_en | default: page.url %}
{% assign german_url = page.translation_de | default: page.url %}

<nav class="language-switcher" aria-label="Language selection">
  {% if current_lang == "en" %}
    <span class="lang-btn active" aria-current="page" aria-label="English">en</span>
    <a class="lang-btn" href="{{ german_url }}" hreflang="de" lang="de" aria-label="Deutsch">de</a>
  {% else %}
    <a class="lang-btn" href="{{ english_url }}" hreflang="en" lang="en" aria-label="English">en</a>
    <span class="lang-btn active" aria-current="page" aria-label="Deutsch">de</span>
  {% endif %}
</nav>
