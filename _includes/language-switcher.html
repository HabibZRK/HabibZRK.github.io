{% assign current_lang = page.lang | default: "en" %}
{% assign english_url = page.translation_en | default: page.url %}
{% assign german_url = page.translation_de | default: page.url %}

<nav class="language-switcher" aria-label="Language selection">
  {% if current_lang == "en" %}
    <span aria-current="page" aria-label="English">EN</span>
    <span class="language-divider" aria-hidden="true">|</span>
    <a href="{{ german_url }}" hreflang="de" lang="de" aria-label="Deutsch">DE</a>
  {% else %}
    <a href="{{ english_url }}" hreflang="en" lang="en" aria-label="English">EN</a>
    <span class="language-divider" aria-hidden="true">|</span>
    <span aria-current="page" aria-label="Deutsch">DE</span>
  {% endif %}
</nav>
